[package]
name = "linux-powerhouse-desktop"
version = "0.1.0"
description = "Linux Powerhouse desktop application"
authors = ["Linux Powerhouse contributors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "linux_powerhouse_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
execution-engine = { path = "../../../crates/execution-engine" }
policy-engine = { path = "../../../crates/policy-engine" }
system-status = { path = "../../../crates/system-status" }
storage-status = { path = "../../../crates/storage-status" }
process-status = { path = "../../../crates/process-status" }
network-status = { path = "../../../crates/network-status" }
monitoring = { path = "../../../crates/monitoring" }
health-status = { path = "../../../crates/health-status" }
serde.workspace = true
serde_json.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
