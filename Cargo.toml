[workspace]
resolver = "2"
members = [
    "crates/powerhouse-core",
    "crates/tool-registry",
    "crates/policy-engine",
    "crates/execution-engine",
    "crates/system-status",
    "crates/storage-status",
    "crates/process-status",
    "crates/network-status",
    "crates/monitoring",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/neerajwork/linux-powerhouse"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
tracing = "0.1"
libc = "0.2"
