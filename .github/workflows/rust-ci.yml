name: Rust CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The Tauri desktop crate is validated by Desktop CI after the
      # frontend is built. Keeping it out of this workspace-only job
      # prevents frontend artifacts from becoming a Rust CI prerequisite.
      - name: Clippy
        run: cargo clippy --workspace --exclude linux-powerhouse-desktop --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude linux-powerhouse-desktop --all-features

      - name: Check
        run: cargo check --workspace --exclude linux-powerhouse-desktop --all-features
